name: CPU reproduction fixtures
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-evaluation.txt psutil transformers==4.57.6
      - name: Offline CPU tests and demo
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          python -B -m unittest discover -s tools/weight-space -p 'test_*.py' -v
          python -B -m unittest discover -s experiments/qwen3_one_matrix -p 'test_*.py' -v
          python -B tools/weight-space/quickstart.py --out "$RUNNER_TEMP/weight-space-demo"
